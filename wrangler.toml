# Cloudflare Worker configuration for GLUT AING Education
name = "wyh12"
main = ".open-next/worker.js"
compatibility_date = "2026-07-04"
compatibility_flags = ["nodejs_compat"]

# Enable workers.dev subdomain (required for wyh12.wyh666.workers.dev)
workers_dev = true

# Route configuration (uncomment and set your custom domain)
# route = "example.com/*"
# routes = [
#   { pattern = "example.com/*", custom_domain = true }
# ]

# Static assets (built by opennextjs-cloudflare)
[assets]
directory = ".open-next/assets"

# Non-secret environment variables
[vars]
NODE_ENV = "production"
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
DEEPSEEK_MODEL = "deepseek-chat"

# Observability
[observability]
enabled = true
